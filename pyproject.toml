[project]
name = "agent"
version = "0.1.0"
description = "LangGraph research agent with multi-step reasoning, retries, and persistence"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.50",
    "langgraph-checkpoint-postgres>=2.0",
    "langchain>=0.3.7",
    "langchain-anthropic>=0.3",
    "langchain-core>=0.3.15",
    "langsmith>=0.1.140",
    "anthropic>=0.40",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "tenacity>=9.0",
    "httpx>=0.27",
    "tavily-python>=0.5",
    "psycopg[binary,pool]>=3.2",
    "streamlit>=1.40",
    "beautifulsoup4>=4.12",
    "readability-lxml>=0.8",
    "lxml>=5.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC", "S", "A", "C4", "T20", "SIM", "RUF"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "T20"]
"src/agent/app.py" = ["T20"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["readability.*", "tavily.*", "langgraph.*", "langchain.*", "langsmith.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
